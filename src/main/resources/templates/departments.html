<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Vacation Management System</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" 
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous" />
    </head>
    <body>
        <div class="container my-2">
            <h1>Manage Departments</h1>
            <hr />
            <a th:href="@{/departments/new}" class="btn btn-primary btn-sm mb-3">Add Department</a>
            <h2 class="mb-3">Department List</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Department Name</th>
                        <th>Department Address</th>
                        <th>Department Floor</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="department : ${listDepartments}">
                        <td th:text="${department.name}"></td>
                        <td th:text="${department.address}"></td>
                        <td th:text="${department.floor}"></td>
                        <td>
                            <a th:href="@{/departments/update(id=${department.id})}" class="btn btn-primary">Update</a>
                            <a th:href="@{/departments/delete(id=${department.id})}" class="btn btn-danger">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${message}" th:text="${message}" class="alert-danger mb-3"/>
            <a th:href="@{/}">Back to Welcome Page</a>
        </div>
    </body>
</html>
