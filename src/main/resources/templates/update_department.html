<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Vacation Management System</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" 
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous" />
    </head>
    <body>
        <div class="container">
            <h1>Manage Departments</h1>
            <hr />
            <h2>Update Department</h2>
            <form action="#" th:action="@{/departments/saveUpdate}" th:object="${department}" method="POST">
                <div class="mb-4 col-4">
                    <input type="hidden" th:field="*{id}" />
                </div>
                <div class="mb-4 col-4">
                    <label th:for="name">Name</label>
                    <input type="text" th:field="*{name}" class="form-control" />
                    <span class="text-danger" th:errors="*{name}"></span>
                </div>
                <div class="mb-4 col-4">
                    <label th:for="address">Address</label>
                    <input type="text" th:field="*{address}" class="form-control" />
                    <span class="text-danger" th:errors="*{address}"></span>
                </div>
                <div class="mb-4 col-4">
                    <label th:for="floor">Floor</label>
                    <input type="number" th:field="*{floor}" class="form-control" />
                    <span class="text-danger" th:errors="*{floor}"></span>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary col-2">Save</button>
                    <a th:href="@{/departments}" class="btn btn-danger col-2">Cancel</a>
                </div>
            </form>
            <hr />
        </div>
    </body>
</html>
